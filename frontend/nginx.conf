# nginx внутри контейнера web: сайт, /api → backend, /rtc → LiveKit.
# Так весь сервис живёт на одном адресе: и локально (http://localhost:8080),
# и на сервере, где перед ним стоит nginx хоста с HTTPS.

# Настоящий IP клиента приходит от nginx хоста в X-Real-IP.
# Доверяем заголовку только от Docker-сетей и localhost.
set_real_ip_from 127.0.0.1;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Real-IP;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Сигналинг LiveKit (WebSocket). Само видео идёт мимо nginx, по UDP 7882 или TCP 7881.
    # Наружу открыт только /rtc: серверный API LiveKit (/twirp) доступен лишь бэкенду.
    location /rtc {
        proxy_pass http://livekit:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }

    # Хешированные файлы сборки не меняются — кешируем надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Точка входа SPA — всегда перепроверять, чтобы новый деплой подхватывался сразу
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
