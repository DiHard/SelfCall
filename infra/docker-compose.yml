# Продакшен SelfCall на сервере, где уже работают другие проекты (Gamma).
#
# Наружу ничего не открывается, кроме портов медиа LiveKit (TCP 7881, UDP 7882).
# Сайт, /api и сигналинг /rtc слушают только 127.0.0.1:${WEB_PORT}, туда проксирует
# nginx хоста (host-nginx/selfcall.conf.template), он же отвечает за HTTPS.
#
# Запуск: cd infra && sudo docker compose up -d --build   (подробно — README.md)
name: selfcall

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  livekit:
    image: livekit/livekit-server:v1.13.11
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
      # Внешний IP, который LiveKit сообщает браузерам для медиа
      NODE_IP: ${NODE_IP:?NODE_IP не задан в .env}
    ports:
      - "7881:7881"       # медиа по TCP (если UDP закрыт у собеседника)
      - "7882:7882/udp"   # медиа по UDP
    mem_limit: 2g
    logging: *logging

  backend:
    build: ../backend
    restart: unless-stopped
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?}
      LIVEKIT_URL: wss://${DOMAIN:?DOMAIN не задан в .env}   # адрес для браузера
      LIVEKIT_API_URL: http://livekit:7880                  # адрес для бэкенда
      MEETING_SECRET: ${MEETING_SECRET:?}
      CORS_ORIGINS: https://${DOMAIN}
      MAX_ACTIVE_MEETINGS: ${MAX_ACTIVE_MEETINGS:-10}
      MAX_PARTICIPANTS: ${MAX_PARTICIPANTS:-10}
      FCM_CREDENTIALS_FILE: ${FCM_CREDENTIALS_FILE:-}
      DIRECT_CALLS_PROXY_SECRET: ${DIRECT_CALLS_PROXY_SECRET:-}
      ANDROID_RELEASES_DIR: /var/lib/selfcall-android
    volumes:
      - direct-call-data:/var/lib/selfcall
      - android-releases:/var/lib/selfcall-android
      - /etc/selfcall:/run/selfcall:ro
    depends_on:
      - livekit
    mem_limit: 256m
    logging: *logging

  web:
    build: ../frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8110}:80"
    depends_on:
      - backend
      - livekit
    mem_limit: 128m
    logging: *logging

volumes:
  direct-call-data:
  android-releases:
