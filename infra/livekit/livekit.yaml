# LiveKit для сервера. Ключи приходят из LIVEKIT_KEYS, внешний IP — из NODE_IP (см. docker-compose.yml).
# Документация: https://docs.livekit.io/home/self-hosting/deployment/
port: 7880

rtc:
  # Всё медиа идёт через один UDP-порт, а если UDP закрыт — через TCP.
  # Оба порта нужно пробросить на роутере на сервер.
  udp_port: 7882
  tcp_port: 7881
  # IP задаём явно через NODE_IP: сервер за роутером, автоопределение тут ненадёжно
  use_external_ip: false

room:
  # Комнаты создаёт только бэкенд — так работает лимит на число встреч
  auto_create: false

# Встроенный TURN выключен. TURN/TLS на 443 потребовал бы менять общий nginx сервера,
# а для строгих сетей пока хватает медиа по TCP 7881.
turn:
  enabled: false

logging:
  level: info
