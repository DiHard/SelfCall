# LiveKit для локального запуска (docker-compose в этой папке).
# Не для сервера: ключи публичные, адрес — localhost.
port: 7880
rtc:
  tcp_port: 7881
  udp_port: 7882
  # Браузер на этом же компьютере ходит к LiveKit через проброшенные порты localhost
  node_ip: 127.0.0.1
  use_external_ip: false
keys:
  devkey: local-dev-secret-0123456789abcdef0123456789
room:
  # Комнаты создаёт только бэкенд — так работает лимит на число встреч
  auto_create: false
logging:
  level: info
